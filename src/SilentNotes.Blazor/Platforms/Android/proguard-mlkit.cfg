# Keep ML Kit barcode scanning components. Release trimming/R8 can strip the
# reflection-discovered registrars, which then crashes getClient() with NPE on zzg.

-keep class com.google.mlkit.** { *; }
-keep class com.google.android.gms.internal.mlkit_** { *; }
-keep class com.google.android.gms.internal.mlkit_vision_barcode** { *; }
-keep class com.google.android.gms.internal.mlkit_vision_barcode_bundled.** { *; }
-keep class com.google.android.gms.internal.mlkit_common.** { *; }
-keep class com.google.android.gms.internal.mlkit_vision_common.** { *; }

-keepclassmembers class * extends com.google.android.gms.internal.mlkit_vision_barcode_bundled.zzeh {
  <fields>;
}

-keepclasseswithmembernames class * {
  native <methods>;
}

-dontwarn com.google.mlkit.**
-dontwarn com.google.android.gms.internal.mlkit_**
